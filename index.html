<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الاقتباسات</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">

        <h1>اقتباس اليوم</h1>
        <p class="subtitle">كلمات بسيطة يمكن أن تغيّر يومك</p>

        <div class="quote-box">
            <span class="quote-icon">❝</span>

            <p id="quote">لا بأس أن تتأخر، المهم ألا تتوقف.</p>

            <h3 id="author">— مجهول</h3>
        </div>

        <div class="buttons">
            <button id="newQuote">اقتباس جديد</button>
            <button id="copyQuote">نسخ الاقتباس</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="./index.js"></script>
</body>
</html>
